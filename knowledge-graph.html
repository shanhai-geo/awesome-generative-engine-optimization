const chart = echarts.init(document.getElementById('graph'), null, {renderer:'canvas'});

function render(filteredNodes) {
  const nodes = filteredNodes || data.nodes;
  const nodeNames = new Set(nodes.map(n => n.name));
  const links = data.links.filter(l => nodeNames.has(l.source) && nodeNames.has(l.target));

  const option = {
    backgroundColor: '#0a0e17',
    tooltip: {
      show: false
    },
    animationDuration: 800,
    animationEasingUpdate: 'quinticInOut',
    series: [{
      type: 'graph',
      layout: 'force',
      roam: true,
      draggable: true,
      zoom: 0.8,
      label: {
        show: true,
        position: 'bottom',
        fontSize: 12,
        color: '#ccc',
        formatter: '{b}'
      },
      edgeSymbol: ['none', 'arrow'],
      edgeSymbolSize: [0, 6],
      force: {
        repulsion: 280,
        gravity: 0.12,
        edgeLength: [80, 180],
        friction: 0.6
      },
      emphasis: {
        focus: 'adjacency',
        label: {fontSize: 14, color: '#fff'},
        lineStyle: {width: 3}
      },
      blur: {
        itemStyle: {opacity: 0.15},
        lineStyle: {opacity: 0.1}
      },
      data: nodes.map(n => ({
        name: n.name,
        value: n.value,
        symbolSize: n.dim === 'core' ? 60 : 20 + n.value * 2,
        itemStyle: {color: n.color, borderColor: n.dim === 'core' ? '#64b5f6' : 'transparent', borderWidth: n.dim === 'core' ? 3 : 0},
        label: {show: true, color: n.dim === 'core' ? '#fff' : '#ccc', fontWeight: n.dim === 'core' ? 'bold' : 'normal', fontSize: n.dim === 'core' ? 16 : 12}
      })),
      links: links.map(l => ({
        source: l.source,
        target: l.target,
        lineStyle: {color: '#2a3a4a', width: 1, curveness: 0.2, opacity: 0.6}
      }))
    }]
  };
  chart.setOption(option);
}

legendEl.innerHTML = dims.map(d => `<div class="legend-item"><div class="legend-dot" style="background:${d.color}"></div>${d.label}</div>`).join('');

// Filter
function filterDim(dim) {
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const filtered = data.nodes.filter(n => n.dim === dim || n.dim === 'core');
  render(filtered);
}
function showAll() {
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.ctrl-btn').classList.add('active');
  render();
}

// Click to navigate
chart.on('click', function(params) {
  const node = data.nodes.find(n => n.name === params.name);
  if (node && node.url && node.url !== '/') {
    window.open(node.url, '_blank');
  }
});

// Hover tooltip
chart.on('mouseover', function(params) {
  const node = data.nodes.find(n => n.name === params.name);
  if (!node) return;
  const tt = document.getElementById('tooltip');
  document.getElementById('tt-title').textContent = node.name;
  document.getElementById('tt-desc').textContent = node.desc || '';
  document.getElementById('tt-tags').innerHTML = `<span class="tag">${node.dim === 'core' ? '根节点' : node.dim}</span><span class="tag">${node.value}篇相关</span>`;
  tt.style.display = 'block';
  tt.style.left = (params.event.event.offsetX + 20) + 'px';
  tt.style.top = (params.event.event.offsetY + 200) + 'px';
});
chart.on('mouseout', function() {
  document.getElementById('tooltip').style.display = 'none';
});

window.addEventListener('resize', () => chart.resize());
render();
